    <rect x="800" y="112" width="200" height="64" rx="12" fill="#111726" stroke="#ffaa40" stroke-width="1.5"/>
    <text x="816" y="138" font-size="13" fill="#e6eaf2" font-weight="650">8 · Companion &amp; tray</text>
