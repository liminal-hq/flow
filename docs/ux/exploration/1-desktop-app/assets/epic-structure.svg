    <rect x="800" y="385" width="200" height="64" rx="12" fill="#111726" stroke="#ffaa40" stroke-width="1.5"/>
    <text x="816" y="411" font-size="13" fill="#e6eaf2" font-weight="650">7 · Quick Capture</text>
